- name: print facts
  hosts: local
  connection: local
  tasks:
    - name: print the facts
      debug:
        msg: "{{ansible_facts}}" # special variable and it is predifine 

- name: print some information
  debug:
    msg: |
    OS Family:  {{ansible_facts['os_family']}}
    private IP: {{ ansible_facts.default_ipv4.address}}

#Ansible Facts are system information 
#collected automatically from managed nodes
