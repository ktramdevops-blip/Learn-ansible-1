- name: variables from from files 
  hosts: local
  connection: local
  vars:
    course: "Ansible  for PLAY"
  vars_prompt:
    - name: course
      prompt: Please enter your course
      private: false  
   
  vars_files:
    - course.yaml
  tasks:
    - name: print course information
      vars:
        course: "ansible from task"
      debug:
          msg: "Hi I am learning {{course}} "  
